services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: facehub_erp
      MYSQL_USER: facehub
      MYSQL_PASSWORD: facehub
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - facehub_mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - facehub_redis_data:/data

volumes:
  facehub_mysql_data:
  facehub_redis_data:
